<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1764c0"><title>お手伝いボード</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#17314a;background:#f1f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:auto;padding:20px 16px 70px}header{background:linear-gradient(120deg,#1468cb,#1bb9a7);color:white;padding:28px 18px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:27px}header p{margin:7px 0 0}.card{background:white;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 5px 18px #1b527414}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sum{background:#e9f4ff;border-radius:14px;padding:18px;text-align:center}.sum b{display:block;font-size:29px;color:#1468cb;margin-top:6px}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:14px;cursor:pointer;font-weight:bold}button:disabled{opacity:.4;cursor:not-allowed}.task{background:#eaf8f4;color:#075b55;min-height:105px;font-size:18px}.task span{display:block;font-size:27px;margin-bottom:6px}.task small{display:block;margin-top:6px}.primary{background:#1764c0;color:white}.danger{background:#ffebeb;color:#a52d2d}.muted{background:#e8edf3;color:#35465b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}input,select{padding:12px;border:1px solid #bacad9;border-radius:10px;min-width:0;width:100%}label{display:block;font-size:14px;margin:12px 0 5px}.hidden{display:none!important}.record{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e5edf3;padding:12px 0}.record:last-child{border:0}.sub{color:#62788a;font-size:13px}.msg{min-height:22px;color:#b33a30;font-size:14px}h2{font-size:19px;margin:0 0 16px}.badge{display:inline-block;background:#e0f4ed;padding:6px 10px;border-radius:20px;font-size:13px}.right{text-align:right}footer{font-size:12px;color:#6d7e8e;margin-top:22px}#auth{max-width:430px;margin:30px auto}.pill{padding:8px 12px;background:#ffffff33;border-radius:99px;font-size:12px} @media(max-width:380px){.task{font-size:15px}}
</style></head><body><header><div class="wrap" style="padding:0 16px"><div class="row"><div style="flex:4"><h1>⭐ お手伝いボード</h1><p>お手伝いして、おこづかいをためよう！</p></div><div id="roleBadge" class="pill hidden"></div></div></div></header><main class="wrap"><section id="auth" class="card"><h2>🔐 ログイン</h2><p class="sub">登録済みの親用・子ども用アカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="primary" style="width:100%;margin-top:16px">ログイン</button><p id="loginMsg" class="msg"></p></section><div id="app" class="hidden"><div class="card"><div class="row"><span id="hello" class="badge"></span><button id="logout" class="muted" style="flex:0 0 auto">ログアウト</button></div></div><section class="card"><div class="grid"><div class="sum">☀️ 今日の合計<b id="today">0円</b></div><div class="sum">🏆 今月の合計<b id="month">0円</b></div></div></section><section class="card"><h2>✨ お手伝いを記録</h2><div id="tasks" class="grid"></div><p id="actionMsg" class="msg"></p><button id="undo" class="muted" style="width:100%">↩ 直前の1回を取り消す</button></section><section class="card"><h2>📅 日ごとの合計</h2><div class="row"><button id="prev" class="muted">◀ 前の月</button><strong id="selectedMonth" style="text-align:center;flex:1.5"></strong><button id="next" class="muted">次の月 ▶</button></div><div id="daily"></div></section><section class="card"><h2>📝 お手伝いの記録</h2><div id="history"></div></section><section id="admin" class="card hidden"><h2>👩 親用の管理画面</h2><p class="sub">入力忘れの追加や、間違えた記録の削除ができます。</p><label>お手伝い</label><select id="adminTask"></select><label>日付</label><input id="adminDate" type="date"><button id="adminAdd" class="primary" style="width:100%;margin-top:14px">＋ 記録を追加</button><p id="adminMsg" class="msg"></p></section><footer>記録はFirebaseに保存されます。インターネット接続が必要です。月別表示は日本時間を基準にします。</footer></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyD9wbwkzg-8oqDVq0RbRNYcri9q_2wtL5g',authDomain:'otetsudai-board-169a4.firebaseapp.com',projectId:'otetsudai-board-169a4',storageBucket:'otetsudai-board-169a4.firebasestorage.app',messagingSenderId:'290709377101',appId:'1:290709377101:web:6a2f443add6ebdf16e4c04',measurementId:'G-XV11NLLPW5'};
// Replace these two placeholders with the UID values from Firebase Authentication.
const PARENT_UID='REPLACE_WITH_PARENT_UID';
const CHILD_UID='REPLACE_WITH_CHILD_UID';
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),items=[['bath','🛁','お風呂洗い',50],['laundry','👕','洗濯物たたみ',50],['rice','🍚','お米炊き',50],['cook','🍳','料理',100]];
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ja-JP')+'円';let user=null,records=[],unsub=null,undoId=null,view=new Date();
const jpDate=(date=new Date())=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);const thisMonth=()=>jpDate().slice(0,7);const pad=n=>String(n).padStart(2,'0');const viewMonth=()=>`${view.getFullYear()}-${pad(view.getMonth()+1)}`;
function role(){return user?.uid===PARENT_UID?'parent':user?.uid===CHILD_UID?'child':'none'}
function status(id,msg){$(id).textContent=msg}
function render(){const current=records.filter(r=>r.day?.startsWith(viewMonth())).sort((a,b)=>(b.day||'').localeCompare(a.day||'')||((b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));$('today').textContent=fmt(records.filter(r=>r.day===jpDate()).reduce((s,r)=>s+r.amount,0));$('month').textContent=fmt(records.filter(r=>r.day?.startsWith(thisMonth())).reduce((s,r)=>s+r.amount,0));$('selectedMonth').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;
const days={};current.forEach(r=>{days[r.day]=(days[r.day]||0)+r.amount});$('daily').replaceChildren();Object.keys(days).sort().reverse().forEach(d=>{const div=document.createElement('div');div.className='record';div.innerHTML=`<span>${d.slice(5).replace('-','月')}日</span><strong>${fmt(days[d])}</strong>`;$('daily').append(div)});if(!Object.keys(days).length)$('daily').textContent='この月の記録はまだありません。';
$('history').replaceChildren();current.forEach(r=>{const line=document.createElement('div');line.className='record';const label=document.createElement('div');label.textContent=`${r.day}　${items.find(x=>x[0]===r.task)?.[2]||'お手伝い'}　${fmt(r.amount)}`;line.append(label);if(role()==='parent'){const btn=document.createElement('button');btn.className='danger';btn.textContent='削除';btn.onclick=()=>remove(r.id,true);line.append(btn)}$('history').append(line)});if(!current.length)$('history').textContent='記録はまだありません。';$('undo').disabled=!undoId||!records.some(r=>r.id===undoId)}
async function add(task,day,admin=false){const x=items.find(i=>i[0]===task);if(!x||!user)return;const id=admin?'adminAdd':'tasks';try{if(admin&&role()!=='parent')throw Error('親用アカウントでログインしてください');if(!admin&&day!==jpDate())throw Error('今日の日付で記録してください');const result=await addDoc(collection(db,'chores'),{task:x[0],amount:x[3],day,createdBy:user.uid,createdAt:serverTimestamp()});if(!admin){undoId=result.id;status('actionMsg',`${x[2]} ＋${x[3]}円！`)}else status('adminMsg','追加しました！');render()}catch(e){status(admin?'adminMsg':'actionMsg','保存できませんでした。ログイン・通信・ルール設定をご確認ください。 '+e.message)}}
async function remove(id,confirmDelete=false){if(confirmDelete&&!confirm('この記録を削除しますか？'))return;try{await deleteDoc(doc(db,'chores',id));if(undoId===id)undoId=null;status('actionMsg','記録を取り消しました');render()}catch(e){status('actionMsg','取り消しできませんでした。 '+e.message)}}
items.forEach(x=>{const b=document.createElement('button');b.className='task';b.innerHTML=`<span>${x[1]}</span>${x[2]}<small>＋${x[3]}円</small>`;b.onclick=()=>add(x[0],jpDate());$('tasks').append(b);const opt=document.createElement('option');opt.value=x[0];opt.textContent=`${x[2]}（${x[3]}円）`;$('adminTask').append(opt)});
$('login').onclick=async()=>{status('loginMsg','');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){status('loginMsg','ログインできませんでした。メールアドレスとパスワードをご確認ください。')}};$('logout').onclick=()=>signOut(auth);$('undo').onclick=()=>undoId&&remove(undoId);$('adminAdd').onclick=()=>add($('adminTask').value,$('adminDate').value,true);$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('adminDate').value=jpDate();
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}user=u;undoId=null;records=[];$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('roleBadge').classList.toggle('hidden',!u);if(!u)return;const r=role();$('roleBadge').textContent=r==='parent'?'親用':r==='child'?'子ども用':'未登録アカウント';$('hello').textContent=r==='parent'?'👩 管理者モード':r==='child'?'👦 お手伝いモード':'⚠️ 利用権限なし';$('admin').classList.toggle('hidden',r!=='parent');if(r==='none'){status('actionMsg','このアカウントには利用権限がありません。UID設定を確認してください。');$('tasks').querySelectorAll('button').forEach(b=>b.disabled=true);return}$('tasks').querySelectorAll('button').forEach(b=>b.disabled=false);unsub=onSnapshot(collection(db,'chores'),snap=>{records=snap.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{status('actionMsg','記録を読み込めません。Firestoreのルールを確認してください。 '+e.message)})});
</script></body></html>
